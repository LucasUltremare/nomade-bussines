# Nomade Business — sobe tudo com:  docker compose up -d --build
# Antes: copie .env.example pra .env e preencha.
services:
  # Banco. Já tem um Mongo (Atlas, outro servidor)? Aponte MONGODB_URI pra ele
  # no .env e apague este serviço e o depends_on.
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  # API do painel + proposta e pagamento públicos (BASE_URL aponta pra cá)
  server:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
        VITE_GOOGLE_APP_ID: ${VITE_GOOGLE_APP_ID:-}
    restart: unless-stopped
    depends_on: [mongo]
    ports:
      - "5002:5002"
    command: ["node", "server.js"]
    environment:
      - NODE_ENV=production
      - PORT=5002
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - MONGODB_DB=${MONGODB_DB:-nomade}
      - MONGODB_OFFICE_DB=${MONGODB_OFFICE_DB:-nomade_office}
      - BASE_URL=${BASE_URL}
      - PAINEL_URL=${PAINEL_URL}
      - ADMIN_URL=${ADMIN_URL:-}
      - ADMIN_BASE_URL=${ADMIN_BASE_URL:-}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - ADMIN_SENHA=${ADMIN_SENHA:-}
      - IDIOMA_PADRAO=${IDIOMA_PADRAO:-}
      - HQ_PROXY_SECRET=${HQ_PROXY_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - EMPRESA_NOME=${EMPRESA_NOME:-}
      - EMPRESA_EMAIL=${EMPRESA_EMAIL:-}
      - EMPRESA_SITE=${EMPRESA_SITE:-}
      - EMPRESA_WHATSAPP=${EMPRESA_WHATSAPP:-}
      - EMPRESA_CIDADE=${EMPRESA_CIDADE:-}
      - EMPRESA_SLOGAN=${EMPRESA_SLOGAN:-}
      - EMPRESA_DESCRICAO=${EMPRESA_DESCRICAO:-}
      - EMPRESA_DESCRITOR=${EMPRESA_DESCRITOR:-}
      - EMPRESA_COR=${EMPRESA_COR:-}
      - LOGO_URL=${LOGO_URL:-}
      - TIME_JSON=${TIME_JSON:-}
      - TIME_FILE=${TIME_FILE:-}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - RELATORIO_SEMANAL=${RELATORIO_SEMANAL:-}
      - PAIS_PADRAO=${PAIS_PADRAO:-}
      - MOEDA_PADRAO=${MOEDA_PADRAO:-}
      - FUSO_PADRAO=${FUSO_PADRAO:-}
      - PUPPETEER_EXECUTABLE_PATH=${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium-browser}
      - BIND_HOST=${BIND_HOST:-}

  # Porta do painel (PAINEL_URL aponta pra cá) + escritório: agents, memória,
  # chat do orquestrador, fila do runner, login e download do CLI.
  office:
    build:
      context: .
    restart: unless-stopped
    depends_on: [mongo, server]
    ports:
      - "5004:5004"
    command: ["node", "ai-service.js"]
    environment:
      - NODE_ENV=production
      - AI_SERVICE_PORT=5004
      - ADMIN_UPSTREAM=http://server:5002
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - AI_MONGODB_URI=${AI_MONGODB_URI:-}
      - MONGODB_DB=${MONGODB_DB:-nomade}
      - MONGODB_OFFICE_DB=${MONGODB_OFFICE_DB:-nomade_office}
      - BASE_URL=${BASE_URL}
      - PAINEL_URL=${PAINEL_URL}
      - ADMIN_URL=${ADMIN_URL:-}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - ADMIN_SENHA=${ADMIN_SENHA:-}
      - HQ_PROXY_SECRET=${HQ_PROXY_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PLACES_KEY=${GOOGLE_PLACES_KEY:-}
      - CORS_DOMINIOS=${CORS_DOMINIOS:-}
      - EMPRESA_NOME=${EMPRESA_NOME:-}
      - EMPRESA_EMAIL=${EMPRESA_EMAIL:-}
      - EMPRESA_SITE=${EMPRESA_SITE:-}
      - EMPRESA_WHATSAPP=${EMPRESA_WHATSAPP:-}
      - EMPRESA_CIDADE=${EMPRESA_CIDADE:-}
      - EMPRESA_SLOGAN=${EMPRESA_SLOGAN:-}
      - EMPRESA_DESCRICAO=${EMPRESA_DESCRICAO:-}
      - EMPRESA_DESCRITOR=${EMPRESA_DESCRITOR:-}
      - EMPRESA_COR=${EMPRESA_COR:-}
      - LOGO_URL=${LOGO_URL:-}
      - ESCOPOS_INTERNOS=${ESCOPOS_INTERNOS:-}
      - EMPRESA_ID=${EMPRESA_ID:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - ORQUESTRADOR_PROVIDER=${ORQUESTRADOR_PROVIDER:-}
      - ORQUESTRADOR_MODEL=${ORQUESTRADOR_MODEL:-}
      - EMBED_MODEL=${EMBED_MODEL:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_TEXT_MODEL=${OLLAMA_TEXT_MODEL:-}
      - LLMGATEWAY_API_KEY=${LLMGATEWAY_API_KEY:-}
      - LLMGATEWAY_URL=${LLMGATEWAY_URL:-}
      - JEV_MODEL=${JEV_MODEL:-}
      - DECISOES_MOTOR=${DECISOES_MOTOR:-}
      - DECISOES_MODELO=${DECISOES_MODELO:-}
      - WORKER_DESLIGADO=${WORKER_DESLIGADO:-}
      - ATENDIMENTO_DESLIGADO=${ATENDIMENTO_DESLIGADO:-}
      - WORKER_INTERVALO_MS=${WORKER_INTERVALO_MS:-}
      # só pra tela Ajustes > Este computador saber o que está ligado
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - PUPPETEER_EXECUTABLE_PATH=${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium-browser}
      - NOMADE_LOCAL=${NOMADE_LOCAL:-}
      - BIND_HOST=${BIND_HOST:-}

volumes:
  mongo-data:
